name: Deploy to VPS

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy
    # Only ever deploy main, even when triggered manually from another branch.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Pack build (dereference symlinks)
        run: tar -chzf web-output.tgz -C apps/web .output

      # The runner and the office runtime each run one self-contained Bun bundle; the VPS has no workspace install for them.
      - name: Bundle runner and office
        run: |
          bun build apps/agents/src/main.ts --target=bun --outfile=agents-main.js
          bun build apps/office/src/main.ts --target=bun --outfile=office-main.js

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload artifacts
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$PORT" "$VPS" 'mkdir -p /root/.vexis-deploy'
          scp -P "$PORT" web-output.tgz ecosystem.config.cjs scripts/deploy-remote.sh "$VPS:/root/.vexis-deploy/"
          scp -P "$PORT" agents-main.js "$VPS:/root/.vexis-deploy/runner-main.js"
          scp -P "$PORT" office-main.js "$VPS:/root/.vexis-deploy/office-main.js"

      # Every process goes through scripts/deploy-remote.sh: swap in, restart that one pm2 process, health check,
      # roll back to the .prev copy on failure. Office is skipped, without failing, until /root/vexis-office exists.
      - name: Deploy web
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: ssh -p "$PORT" "$VPS" 'bash /root/.vexis-deploy/deploy-remote.sh web'

      - name: Deploy agents runner
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: ssh -p "$PORT" "$VPS" 'bash /root/.vexis-deploy/deploy-remote.sh runner'

      - name: Deploy office runtime
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: ssh -p "$PORT" "$VPS" 'bash /root/.vexis-deploy/deploy-remote.sh office'
